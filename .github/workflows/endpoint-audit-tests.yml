name: Endpoint Audit Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'PowerShell-Security-Toolkit/**'
      - '.github/workflows/endpoint-audit-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'PowerShell-Security-Toolkit/**'
      - '.github/workflows/endpoint-audit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester on Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Pester 6.2.0
        shell: pwsh
        run: |
          Install-Module `
              -Name Pester `
              -RequiredVersion 6.2.0 `
              -Scope CurrentUser `
              -Force `
              -SkipPublisherCheck

      - name: Run Endpoint Audit tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.2.0

          Invoke-Pester `
              -Path './PowerShell-Security-Toolkit/Tests/EndpointAudit' `
              -Output Detailed `
              -CI
